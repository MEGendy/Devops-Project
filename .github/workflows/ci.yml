
name: Docker CI/CD to AWS

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  build-and-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::530751149473:role/github-actions-ecr-role
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: 530751149473.dkr.ecr.us-east-1.amazonaws.com
          ECR_REPOSITORY: docker-lab
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Deploy to EC2 using SSM
        env:
          AWS_REGION: us-east-1
          EC2_INSTANCE_ID: i-0341f31aeada69cc3
          ECR_REGISTRY: 530751149473.dkr.ecr.us-east-1.amazonaws.com
          ECR_REPOSITORY: docker-lab
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -eu

          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          COMMANDS=$(python3 -c 'import json,sys; print(json.dumps({"commands": [
            "set -eu",
            "ECR_REGISTRY=\"530751149473.dkr.ecr.us-east-1.amazonaws.com\"",
            "IMAGE=\""+sys.argv[1]+"\"",
            "aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin \"$ECR_REGISTRY\"",
            "docker pull \"$IMAGE\"",
            "OLD_IMAGE=$(docker inspect --format=\"{{.Config.Image}}\" my-web 2>/dev/null || true)",
            "docker rm -f my-web 2>/dev/null || true",
            "if docker run -d --name my-web --restart unless-stopped -p 80:80 \"$IMAGE\"; then sleep 5; if curl --fail --silent http://localhost/ >/dev/null; then echo \"Deployment successful\"; exit 0; fi; fi",
            "echo \"Deployment failed; attempting rollback\"",
            "docker rm -f my-web 2>/dev/null || true",
            "if [ -n \"$OLD_IMAGE\" ]; then docker run -d --name my-web --restart unless-stopped -p 80:80 \"$OLD_IMAGE\"; else echo \"No previous image available\"; fi",
            "exit 1"
          ]}, separators=(",",":"))' "$IMAGE")

          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Docker image from GitHub Actions" \
            --parameters "$COMMANDS" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command ID: $COMMAND_ID"

          for attempt in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success)
                echo "Deployment completed successfully."
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
                  --output json
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "Timed out waiting for SSM deployment result."
          exit 1
